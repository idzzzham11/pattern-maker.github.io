name: pattern_maker_app
description: A Flutter pattern making application for clothing design students
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icons/icon.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/necklines/
    - assets/images/collars/
    - assets/images/bodices/
    - assets/images/sleeves/
    - assets/images/skirts/
